[project]
name = "agentic-mrm-lifecycle-governance"
version = "0.1.0"
description = "SR 11-7 + NIST AI RMF + Databricks Unity Catalog + Data Vault 2.0 Agentic MRM Governance"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.sqlfluff.core]
dialect = "databricks"
max_line_length = 100
