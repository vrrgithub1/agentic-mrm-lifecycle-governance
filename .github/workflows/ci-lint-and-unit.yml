name: CI Lint & Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff sqlfluff pytest pydantic pyyaml
      - name: Lint Python with Ruff
        run: ruff check src tests
      - name: Lint SQL with SQLFluff
        run: sqlfluff lint governance_policies src/data_vault
      - name: Run Unit Tests
        run: pytest tests/unit -v